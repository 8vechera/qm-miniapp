<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QM · Видео-продакшен</title>

  <!-- Telegram Mini App SDK. Обязателен: даёт доступ к теме, кнопкам и данным Telegram.
       Внутри Telegram подгружается автоматически. В обычном браузере просто игнорируется. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Шрифт фоновой типографики: Oswald (узкий/вытянутый, с кириллицей) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css?v=18" />
</head>
<body>

  <!-- ================= ИНТРО-ЗАСТАВКА: логотип «QM» рисуется штрихом ================= -->
  <div id="splash" aria-hidden="true">
    <svg class="brand-logo" viewBox="0 0 250 130" fill="none" role="img" aria-label="QM">
      <!-- Q-объектив: кольцо + хвост (оранжевые), вровень с M -->
      <path class="draw q-ring" d="M 71.7 101.3 A 40 40 0 1 1 98.3 74.7"
            pathLength="1" stroke="#F23E1E" stroke-width="22" stroke-linecap="round"/>
      <line class="draw q-tail" x1="78" y1="81" x2="98" y2="101"
            pathLength="1" stroke="#F23E1E" stroke-width="22" stroke-linecap="round"/>
      <!-- M (белая на тёмном фоне заставки): угловатая, умеренный V, отцентрована по кольцу Q -->
      <path class="draw m" d="M 139 108 L 139 42 L 176 74 L 213 42 L 213 108"
            pathLength="1" stroke="#f2f2f4" stroke-width="22" stroke-linejoin="miter" stroke-miterlimit="6" stroke-linecap="butt"/>
    </svg>
  </div>

  <!-- Логотип-шапка: всегда висит сверху (не тает при прокрутке) -->
  <div id="brand">
    <svg viewBox="0 0 250 130" fill="none" role="img" aria-label="QM">
      <g stroke="#F23E1E" stroke-width="22" stroke-linecap="round">
        <path d="M 71.7 101.3 A 40 40 0 1 1 98.3 74.7"/>
        <line x1="78" y1="81" x2="98" y2="101"/>
      </g>
      <path d="M 139 108 L 139 42 L 176 74 L 213 42 L 213 108"
            stroke="currentColor" stroke-width="22" stroke-linejoin="miter" stroke-miterlimit="6" stroke-linecap="butt"/>
    </svg>
  </div>

  <!-- ===== ФИКС-ФОН ГЛАВНОГО ЭКРАНА (за скролл-слоем) ===== -->

  <!-- Крупная фоновая типографика ЗА объективом: «Full cycle production» (= «Продакшн полного цикла»,
       по-английски с 08.11) — при прокрутке уезжает вверх. Третье слово — оранжевое. -->
  <div class="bg-type-layer" aria-hidden="true">
    <div class="bg-type-state" id="bg-a">
      <span class="bg-word a1">FULL</span>
      <span class="bg-word a2">CYCLE</span>
      <span class="bg-word a3 accent">PRODUCTION</span>
    </div>
  </div>

  <!-- 3D-объектив — фиксированный фон; прокрутка гонит анимацию через postMessage (app.js) -->
  <iframe id="hero-frame" class="hero-bg" title="3D-анимация объектива" loading="eager"></iframe>
  <div class="hero-copy" id="hero-copy">
    <div class="hero-hint">листайте вниз ↓</div>
  </div>

  <!-- ===== СКРОЛЛ-СЛОЙ: собственный контейнер прокрутки поверх фикс-фона.
       На iOS Telegram перехватывает body-скролл, поэтому листаем ЭТОТ контейнер. ===== -->
  <main id="scroll">

    <!-- ГЛАВНАЯ — единственный экран (вкладок нет с 08.11):
         hero («листайте вниз») → кейсы (2 + «Смотреть больше») → как мы работаем → расчёт -->
    <section class="screen" id="screen-home">
      <!-- Пустая зона прокрутки: пока листаем её — играет 3D-анимация над фоном -->
      <div class="hero-spacer"></div>
      <!-- Контент наезжает поверх зафиксированного 3D-фона -->
      <div class="home-content">
        <div class="demo-banner" hidden>Прототип QM 2.0 · всё с меткой <b>ДЕМО</b> — заглушки</div>

        <!-- КЕЙСЫ: сразу видны 1 подкаст + 1 мероприятие, остальные — по кнопке -->
        <section class="home-section" id="cases">
          <h2 class="screen-title" id="cases-title">Кейсы</h2>
          <div class="portfolio-grid" id="cases-main"><!-- из data.js: cases --></div>
          <div class="portfolio-grid cases-more" id="cases-more" hidden></div>
          <button class="ghost-btn more-btn" id="cases-toggle" hidden></button>
        </section>

        <!-- КАК МЫ РАБОТАЕМ -->
        <section class="home-section">
          <h2 class="screen-title">Как мы работаем <span class="demo-tag" id="process-demo" hidden>ДЕМО</span></h2>
          <ol class="process" id="process"><!-- из data.js: process --></ol>
        </section>

        <!-- РАСЧЁТ ПРОЕКТА (калькулятор-бриф) -->
        <section class="home-section" id="calc-section">
          <h2 class="screen-title">Расчёт проекта</h2>
          <p class="section-lead">Ответьте на несколько вопросов — посчитаем ориентир и соберём бриф для менеджера.</p>
          <div class="calc-card" id="calc-card">
            <div class="calc-head">
              <button class="calc-back" id="calc-back" hidden>‹ Назад</button>
              <div class="calc-progress"><div class="calc-progress-bar" id="calc-bar"></div></div>
              <div class="calc-step-n" id="calc-step-n"></div>
            </div>
            <div class="calc-price" id="calc-price" hidden>
              <span class="price-label">Предварительно</span>
              <span class="price-value" id="price-live">—</span>
            </div>
            <div class="calc-body" id="calc-body"><!-- шаги рисует app.js --></div>
          </div>
        </section>

        <!-- Сразу в личку менеджера (отдельной вкладки «Связь» больше нет) -->
        <button class="link-btn" id="ask-manager">Остались вопросы? Напишите нам ›</button>
      </div>
    </section>

  </main>

  <!-- Лист кейса (открывается по клику на кейс): видео + задача/что сделали/за кадром + действия -->
  <div class="modal hidden" id="video-modal">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-body">
      <button class="modal-close" id="modal-close" aria-label="Закрыть">✕</button>
      <div class="video-wrap" id="video-wrap"></div>
      <h3 class="video-title" id="video-title"></h3>
      <p class="video-desc" id="video-desc"></p>
      <div class="case-details" id="case-details"></div>
      <div class="case-actions">
        <button class="primary-btn" id="case-want">Хочу так же</button>
        <button class="ghost-btn" id="case-ask">Спросить про кейс</button>
      </div>
    </div>
  </div>

  <!-- Всплывающая подсказка (скопировано и т.п.) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js?v=18"></script>
  <script src="js/app.js?v=18"></script>
</body>
</html>
